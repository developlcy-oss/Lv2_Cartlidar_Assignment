# mission_node 설정 (Mission 팀) — 기본 실행 (plan 모드) 은 mission_plan.yaml 을 덧씌움, 옛 태그 미션표 mission_table.yaml 은 tag 모드에서만
# 시작 · 정지: ros2 service call /mission/start std_srvs/srv/Trigger  (조이스틱 버튼은 joy_teleop이 같은 서비스 호출)
#             ros2 service call /mission/stop std_srvs/srv/Trigger
# E-stop · 진단 오류로 PAUSED가 되면 리셋 후 /mission/start로 재개 (자동 재개 없음)
# 자세 값은 manipulator가 정한다. 정렬 거리(align.coarse_distance · 미션표 approach <거리>)는 여기서 drive에 넘긴다
mission_node:
  ros__parameters:
    auto_start: false            # true면 서버가 모두 준비되는 즉시 시작 (테스트용)

    map_frame: map
    base_frame: base_link
    arm:
      travel_pose: DRIVE         # 주행 · 탐색 · 접근 시작 때 팔 자세 (manipulator poses 이름, #144). STOW = 전원 끄기 전 대기 자세
    behavior_tree: ""            # 빈 문자열 = nav2 기본 BT

    # 단계별 타임아웃 (s) · 재시도
    timeout:
      pose: 20.0
      read_tag: 90.0             # 회전 탐색 포함
      navigate: 120.0
      search: 60.0               # 주행 자세 + 회전 탐색 포함
      approach: 90.0             # 주행 자세 → COARSE → 정렬 자세 → FINE
      pick: 60.0
    skill:
      default_timeout: 30.0      # skill 단계에 timeout을 안 쓰면
      timeout_margin: 5.0        # mission 쪽 타임아웃 = skill timeout + margin
    max_retries: 2               # 단계별 재시도 횟수 (총 시도 = 1 + max_retries), 넘으면 FAILED
    retry_delay: 1.0             # cancel 후 재시도까지 대기 (s)

    stale_timeout: 0.3           # 300ms 규칙 (계약)

    tag:
      confirm_count: 2           # 같은 tag_id 연속 N회 → 확정
      view_wait: 2.0             # 이 시간 안에 안 보이면 회전 (s)
      rotate_step_deg: 30.0
      max_rotations: 11          # 30° × 11 + 처음 = 한 바퀴

    search:
      confirm_count: 3           # object_found 연속 N회 → 찾음
      view_wait: 2.0             # 이 시간 안에 없으면 회전 (s)
      rotate_step_deg: 45.0
      max_rotations: 4           # 앞뒤 D435 각 ~87° → 45° × 4 = 180°면 한 바퀴

    align:
      tolerance: 0.0             # 0 = drive 기본값 (align.default_tolerance)
      # 먼 거리 정렬 (COARSE) 목표 [m] = 차체 앞 끝 → 퍽 중심. 퍽 위치는 앞 D435 (색 검출 + 깊이, base_link), 라이다 아님
      #   drive align.coarse_min 0.30 이상. 아래 범위는 계산값 (Gazebo · 실물 확인 전)
      #   plan 모드 시작 박스 (퍽 = 박스 중심, 면 → 퍽 0.1025): 대기 자리 standoff 0.40 · 0.45 → 앞 끝 → 퍽 0.50 · 0.55
      #   하한 0.40: TFmini → 박스 면 ≈ 이 값 − 0.10. 0.35 면 TFmini 0.25 = obstacle_stop stop_m 이라 전진이 막힘
      #              (COARSE 동안은 정지 거리를 낮추지 않음, FINE 만) → 여유 0.05 를 더함
      #   상한 0.48: COARSE 는 목표보다 멀면 전진, 가까우면 후진. 대기 자리 (0.50) 에서 앞으로 다가가며 맞추려면
      #              0.50 − 허용오차 0.02 이하. 더 크면 대기 자리에서 뒤로 물러남
      #   정렬 자세 (ALIGN) 팔 앞 끝은 base_link x 0.179 (차체 앞 끝보다 0.046 m) · 바닥 위 0.14 m 라 이 거리에서 상자에 닿지 않음 (#154)
      #   장소 (빈 상자) 는 따라갈 퍽이 없어 COARSE 가 "물체 놓침" 으로 실패함 → #160
      coarse_distance: 0.45
      arm_pose: ALIGN            # FINE 정렬 때 팔 자세 (manipulator poses). 팔 카메라가 퍽을 봐야 arm_offset 이 나옴 (#188 · #154, 예전 READY 는 하늘을 봄)
    pick:
      require_grasped: true      # grasped=false면 실패 → 직전 search부터 재시도

    diagnostics:
      name_prefix: "opencr/"     # 이 이름으로 시작하는 진단만 본다 (계약)
      # TODO(Firmware): opencr_hardware의 /diagnostics 발행이 확인되면 3.0 (확인 전에는 0 = 끔)
      timeout: 0.0
    # 위치 추정 상태 (localization loc_monitor, #93 #111). OK · SUSPECT 가 아니면 Nav2 단계 (goto · navigate · 제자리 회전) 는
    #   goal 을 둔 채 기다리고 그 시간을 timeout 에 세지 않음. max_lost_s 넘거나 FAILED 면 PAUSED → 위치를 바로잡고 /mission/start
    #   status 를 한 번도 못 받으면 (localization 을 안 띄움) 쓰지 않음. 빈 문자열 = 끔
    localization:
      status_topic: /localization/status
      max_lost_s: 90.0           # ★ 실물에서 위치를 다시 찾는 데 걸리는 시간 보고 조정

    # ---- plan 모드 (주사위 기억 로봇 발제 v5) — bringup mission_source · mission_bringup source 기본 (plan) 이면 mission_plan.yaml 이 덮어씀 ----
    mission_source: tag          # tag = 옛 미션표 mission_table.yaml (태그 → 단계), plan = observe → plan (mission_planner_node 가 단계를 줌)
