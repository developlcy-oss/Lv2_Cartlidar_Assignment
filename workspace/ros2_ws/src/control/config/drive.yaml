drive_node:
  ros__parameters:
    nav2_action: navigate_to_pose
    spin_action: spin
    stale_s: 0.3                   # result · /tfmini/range · /scan · odom 300 ms 규칙
    navigate:
      xy_goal_tolerance: 0.05      # 이 안의 목표는 nav2 spin 으로. navigation/config/nav2_params.yaml goal checker xy_goal_tolerance 와 같게
                                   # (Gazebo 2026-11-04: 0.025 면 마지막 옆 2 ~ 3 cm 를 못 메워 실패, #114). 정밀 위치는 align COARSE · FINE
      spin_time_allowance: 15.0
      spin_nocheck_deg: 3.0        # (11-22) 이 각 이하의 작은 spin 은, 라이다로 차체 외곽 둘레 여유가 충분할 때만 Nav2 충돌검사 끔 (상자 앞 Collision Ahead 대책). 0 = 끔
      spin_nocheck_clear: 0.03     # (11-22) 외곽 ↔ 스캔 점 거리 ≥ (모서리 쓸림 ρ·각 + 이 값) 이어야 끔 [m]. /scan 없음·오래됨이면 안 끔
      backoff:                     # 박스 앞 정차 중 navigate → Nav2 전에 곧게 후진 (#157). 뒤 /scan (scan.rear_stop) · 뒤 카메라가 막히면 멈춰 기다림
        speed: 0.08                # [m/s]
        max_m: 0.30                # FINE 자리 (TFmini 0.13) → 0.35 확인까지 약 0.22 m. 이만큼 가도 확인 못 하면 되돌리고 Nav2
        timeout_s: 8.0             # 막혀 기다린 시간 포함. 넘으면 navigate 실패 (mission 재시도)
      pullout:                     # 뒤가 벽에 붙은 채 navigate → Nav2 전에 곧게 전진 (2026-11-19, control/pullout.hpp). 못 가도 실패 없이 Nav2
                                   #   Gazebo: 팔레트 집기 자리 (1.47, 0.31) 뒤 벽 0.29 m 에서 Nav2 제자리 회전 → 뒤 모서리가 벽 칸에 걸려 MPPI · 복구 모두 거부
        enabled: true
        rear_clear_m: 0.33         # 뒤 /scan (± rear_half_angle) 가장 가까운 점이 이 안이면 전진 (뒤 모서리 회전 반지름 0.271 + padding + 칸)
        rear_half_angle: 0.785     # 45° (모서리 방향 ±38° 포함, 옆 통로 벽은 덜 잡게)
        front_clear_m: 0.35        # 앞 /scan (± scan.half_angle) 이 이 안이면 전진 안 함 (주행 자세 팔 앞 0.25 + 여유)
        front_tfmini_m: 0.20       # TFmini 가 이 안이거나 값 없음이면 전진 안 함 (/scan 아래 상자 · 퍽)
        speed: 0.05                # [m/s]
        max_m: 0.06                # 최대 전진 [m]
        timeout_s: 3.0
      # 위치 추정 상태로 목표 막기 (#121, include/control/loc_gate.hpp). loc_monitor (/localization/status) 가 없는 실행은 false
      #   (bringup 은 use_loc_gate 인자로 덮어씀, 기본 = use_loc_lock)
      loc_gate:
        enabled: true
        wait_s: 60.0               # 보내기 전 · 잃은 동안 Nav2 실패 뒤 OK 를 기다리는 최대 시간 (인지 모의 도구와 같음)
        stale_s: 1.0               # 상태를 이만큼 못 받으면 나쁜 상태 (loc_monitor 10 Hz)
        start_states: ["OK"]       # 이 상태에서만 목표를 보냄 · 다시 보냄
        run_states: ["OK", "SUSPECT"]   # 진행 중 이 밖으로 나가면 "잃음" (twist_mux 잠금과 같은 기준, loc_monitor OK_STATES)
    base:
      front_offset: 0.1328         # base_link → 차체 앞 끝 x ★ B안 상판 앞 끝 (make_maze_scene BODY_X, TFmini 렌즈 x 0.130, 계획기 poses.FRONT). 실측값이 있으면 그 값 (#31)
    align:
      rate_hz: 20.0
      kp_yaw: 1.2                  # 정밀: rad/s per 정규화 가로 오차
      kp_lin: 1.0
      max_angular: 0.6
      max_linear: 0.08
      lateral_tolerance: 0.04
      settle_cycles: 10
      coarse_kp_yaw: 1.5           # 먼 거리
      coarse_kp_lin: 0.8
      coarse_max_speed: 0.15
      coarse_max_angular: 0.8
      coarse_yaw_tolerance: 0.05
      coarse_min: 0.30             # 먼 거리 모드에서 이보다 작은 목표는 거부
      mode_wait_s: 0.5             # goal 뒤 첫 새 result 를 기다리는 시간 (모드 결정)
      lost_timeout_s: 0.5
      timeout_s: 30.0
      min_target_distance: 0.13    # 정밀 목표 = TFmini 렌즈 → 박스 앞면 [m]. 최소 측정 0.10 + box.stop_margin
      default_tolerance: 0.01      # ★ TFmini 실측 보정 뒤 반복 정밀도에 맞출 것 (사양 ±5 cm, 보정 없이는 1 cm 를 못 맞춤)
      box:                         # 정밀 전후 거리 = /tfmini/range (1층 TFmini → 퍽이 놓인 박스 앞면, 205 × 205 × 70 mm)
        window: 5                  # 최근 측정 수 (TFmini 50 Hz → 0.1 s)
        min_samples: 3             # 이 수 이상 유효해야 씀
        spread_m: 0.03             # 창 안 최대 − 최소가 이보다 크면 무효 (빔이 박스 모서리에 걸림)
        stop_margin: 0.03          # 정밀 동안 obstacle_stop 정지 거리 = 목표 − 이 값 (TFmini 최소 0.10 이상)
        stop_min: 0.10
        obstacle_stop_node: /obstacle_stop
        # 박스 앞 정차 (#157): FINE 이 박스 앞에서 끝나면 낮춘 정지 거리를 유지하고, TFmini 가 이 거리 이상을 연속으로 재면 (물러남) 되돌림
        park_release_m: 0.35       # = perception lidar.yaml obstacle_stop release_m
        park_release_count: 3      # = obstacle_stop release_count
        park_refresh_s: 20.0       # 정차 중 낮춘 값 다시 보내기 (< obstacle_stop approach_max_s 60 — 그 자동 복귀는 drive_node 가 죽었을 때만)
      center:                      # 상자 중앙 맞춤 (2026-11-20, include/control/box_center.hpp). FINE (퍽 arm_offset → 회전) 이 끝나면
                                   #   Arducam 상자 윗면 측정 (/perception/place_box/measure, 사전값 = TFmini 로 본 상자 중심) → 상자 법선 · 중심선 옆 어긋남 →
                                   #   법선으로 회전 · 곧게 후진 · 비스듬 전진 · 법선으로 회전 → 법선 yaw + TFmini 유지. 계획기 FINE 자리 (상자 중심이 정면 box_x) 와 맞춤
                                   #   측정 실패 · max_shift 초과 → 움직이지 않고 FINE 결과로 성공. 기동 중 뒤 막힘 · 끊김 · 시간 초과 → 기존 FINE 으로 되돌아감
                                   #   false = 이전 동작 그대로 (goal.center 도 움직이지 않고 성공). ★ Gazebo · 실물 미시험
                                   #   (11-20 흐름 변경) 측정은 mission center_box 단계가 팔 BOX_VIEW 로 하고 (ALIGN 자세에서는 상자 변이 화면 밖)
                                   #   팔을 ALIGN 으로 되돌린 뒤 goal.center · center_box 로 넘김 → 여기서는 측정 없이 기동부터. 아래 measure_* · prior_* ·
                                   #   max_iter (재측정) 는 auto_after_fine 일 때만 씀
        enabled: true
        auto_after_fine: false     # true = FINE 끝에 drive 가 스스로 measure_service 호출 (예전 방식, 팔이 ALIGN 이라 대개 "못 찾음")
        measure_service: /perception/place_box/measure   # 팔 Arducam (ARM_ALIGN 켜짐). 앞 D435 로 하려면 /perception/place_box/measure_front
        box_half: 0.1025           # [m] 상자 반 변 (perception arm.place_box.box / 2)
        prior_delay_s: 0.3         # 사전값 발행 → 측정 요청 사이
        measure_timeout_s: 12.0    # 측정 결과 기다림 (Jetson 팔 영상 3 장 × 약 3 s)
        lateral_tolerance: 0.005   # [m] 기동 건너뛰는 문턱: 이 안이면 옆 이동 없이 법선 yaw 만 맞춤 (11-21: 0.015 → 0.005 = mission done_lateral,
                                   #   반복 판단은 mission decide_loop — 5 mm 아래 기동은 정밀도보다 작아 의미 없음)
        max_shift: 0.08            # [m] 이보다 크면 측정을 믿지 않음
        back_min: 0.04             # [m] 후진 거리 = |옆| / tan(α) + 모서리 몫 δ 를 [back_min, back_max] 로 (11-21: 0.06 → 0.04)
        back_max: 0.15             #   뒤 /scan (scan.rear_stop) · 뒤 카메라가 막히면 포기 → 기존 FINE
        max_alpha: 0.436           # [rad] 비스듬 전진 각 (25°, 11-21: 0.35 → 0.436 — 직진이 짧아 끝 yaw 오차에 덜 민감, 모서리 침범 5.2 cm)
        alpha_hard: 0.52           # [rad] 뒤 여유가 모자라면 각을 이것까지 키워 다시 계획 (30°, 모서리 침범 5.8 cm)
        alpha_min: 0.10            # [rad] S 자 (후진 없음) 각 하한
        s_curve: true              # 앞 틈 ≥ |옆|/tanα + 모서리 침범 + corner_margin 이면 후진 없이 S 자 (FINE 자리 틈 0.13 → |옆| ≤ 약 2.7 cm)
        corner_margin: 0.02        # [m] 회전 · 비스듬 자세에서 앞 모서리 (0.1328, ±0.1676) ↔ 상자 앞면 평면 여유 (box_center.hpp corner_intrusion)
        corner_y: 0.1676           # [m] 상판 앞 모서리 |y| (drive_demo box_face.FRONT_CORNERS)
        forward_cut_slack: 0.02    # [m] 비스듬 전진 중 TFmini < 계획 끝 틈 − 이 값이면 일찍 끝냄 (하한 forward_min_m)
        lidar_topic: /scan_front   # 상자 앞면 라이다 (원본. /scan_merged 는 차체 마스크 x ≤ 0.285 가 상자를 지움). "" = 안 씀
        lidar_scans: 5             # 최근 장 수 (중앙값)
        lidar_min_ok: 4            # 이 수 이상 맞춰져야 ok (box_face.py AVG_LOOSE)
        lidar_max_age_s: 1.0
        lidar_min_gap: 0.15        # [m] 라이다 틈이 이보다 작으면 섞지 않음 (LDS-03 range_min 0.12 ≈ 라이다 x 0.1318 − 앞 끝)
        lidar_tf: [0.1318, 0.0, -1.0, 0.0, 0.0, 1.0]   # TF 가 없을 때 laser_front → base_link (tx, ty, r00, r01, r10, r11), roll π
        sensor_disagree: 0.02      # [m] Arducam 옆 ↔ 라이다 옆 차이가 이보다 크면 불일치
        disagree_skip: true        # 불일치면 움직이지 않고 center_reason "disagree" (mission 이 다시 잼)
        fuse_w_arducam_yaw: 0.93   # 요 결합 가중 (Arducam σ≈0.4° · 라이다 5 장 σ≈1.5°)
        speed: 0.05                # [m/s]
        kp_yaw: 2.0
        max_angular: 0.4
        min_angular: 0.12          # ★ 실물 제자리 회전 시작 속도 (turn.min_angular 와 같이)
        yaw_tolerance: 0.017       # [rad] 기동 회전 끝 (약 1°). 마지막 유지는 align.box_only.yaw_tolerance
        forward_min_m: 0.10        # [m] 비스듬 전진 끊는 TFmini 하한 (최소 측정). 11-21: 0.12 → 0.10 — S 자는 계획상 0.13 보다 가까워짐
        phase_timeout_s: 8.0       # 기동 단계 하나 (회전 · 후진 · 전진) 시간 상한
        timeout_s: 45.0            # goal 하나 (기동 1 회 + 유지) 시간 상한, align.timeout_s 와 따로. 넘으면 기존 FINE
                                   #   (11-21) 반복 (K_max 3, 전체 90 s) 은 mission center_box 가 goal.center 를 여러 번 보내며 셈
        max_iter: 1                # 옆 이동 횟수. 2 면 이동 뒤 다시 재고 한 번 더 (측정 시간만큼 늘어남)
        rear_half_angle: 0.785     # 후진 전 뒤 여유: 뒤 /scan ± 이 각 가장 가까운 점 − scan.rear_stop 까지만 후진 (pullout 처럼). back_min 안 되면 기동 안 함
        final_puck: false          # 옆 이동을 했으면 마지막에 퍽 arm_offset → 회전 (전후 TFmini) 로 마무리. 퍽이 화면에 없으면 건너뜀
                                   #   (11-21 사용자 결정: 중앙 = 상자 면 중심 → 끔. 켜면 최대 6° 돌아 그리퍼 약 2.6 cm 옆으로)
        max_puck_yaw_dev_deg: 6.0  # 퍽 쪽 방향이 상자 법선에서 이보다 벌어지면 돌지 않고 경고 ("칸 어긋남?")
        arm_target_topic: /perception/arm_target   # 돌기 전 퍽 위치 판단 (없으면 회전 중 각도로만 막음)
    scan:
      required: true               # 먼 거리 접근은 /scan 없으면 중지
      half_angle: 0.349            # ±20°
      front_margin: 0.18           # 물체 (퍽) 보다 이만큼 이상 가까운 점 → 정지. 11-20 앞 라이다 1.5 cm 낮춤 (스캔면 59.75 mm < 상자 70) 으로 상자 앞면이 보임: 퍽 거리 − 0.1025 (반변) → 0.10 이면 매번 거짓 '전방 장애물'. 0.18 = 반변 0.1025 + 퍽 0.04 + LDS 오차 0.02 + 여유 (전 0.10)
      rear_stop: 0.30
      rear_camera: true            # 후진 때 /perception/rear_obstacle (뒤 D435) 도 확인, 값 없음 = 막힘 (#84). bringup use_perception:=false 면 끔
    skill:
      enabled: false               # robot_policy(ONNX Runtime) 연결 전까지 false → goal 거절 → mission fallback
      policies_file: ""            # 예: /home/jetson/robot_ws/install/robot_policy/share/robot_policy/config/policies.yaml
      max_linear: 0.3
      max_angular: 1.5
      scan_bins: 360
      front_margin: 0.10             # 정책 주행: 범퍼 앞면(base.front_offset) + 이 거리 안에 점 (±scan.half_angle) → 전진 0, 회전 허용 ★
    turn:                          # 상자 퍽 45° 집기 제자리 회전 turn_p<deg> · turn_m<deg> · turn_0 (#77). skill.enabled 와 상관없이 받음
      kp: 2.0                      # (rad/s) / rad, 되먹임 = /odometry/filtered yaw, 기준 = 직전 FINE 정렬 성공 때 yaw
      max_angular: 0.6
      min_angular: 0.15            # ★ 실물에서 제자리 회전이 시작되는 최소 속도로
      tolerance_deg: 1.0           # 끝 yaw 허용 (이슈 ±1.5°)
      settle_cycles: 6             # 20 Hz × 6 = 0.3 s
      max_deg: 30.0                # 이보다 큰 회전 이름은 거부
      j1_x: 0.096                  # base_link → J1 축 x (mission_planner poses.J1_X)
      center_x: -0.04035           # 계획기가 가정한 회전 중심 = 외곽 가운데 (poses.CENTER_X)
      # 실제 제자리 회전 중심 x 는 robot_geometry.yaml base.icr_x (EKF odom_icr 와 같은 값, #92). J1 옆 이동이 같게 각을 바꿈: 17.06° → 14.3°
