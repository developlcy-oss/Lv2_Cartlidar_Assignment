# 증속벨트 1:2.0 (v7 44T → 22T, 2026-11-14 · 이전 1:1.5 는 2026-10-27 장착) — controllers_4wd.yaml 다음에 diff_drive_controller 에 덮어 씀
#   바퀴 한계: 모터 7.51 rad/s (WHEEL_VEL_LIMIT_RAW 313) × 2.0 = 15.02 rad/s ≈ 0.503 m/s (펌웨어 자르기, 2026-11-11 T4) · 11.1 V 모터 무부하 한계 14.661 rad/s ≈ 0.491 m/s (URDF, #15)
#   max_velocity 0.45 = URDF 한계의 약 92 % (v7, 사용자 결정 2026-11-14 · 이전 0.34). nav2 MPPI vx_max 0.2 는 그대로
diff_drive_controller:
  ros__parameters:
    wheel_separation: 0.317          # 바퀴 중심 |y| 0.1585 × 2 (URDF drive:=belt 와 같게) ★ 장착 후 실측, 미끄럼은 multiplier 로
    linear.x.max_velocity: 0.45
    linear.x.min_velocity: -0.45
