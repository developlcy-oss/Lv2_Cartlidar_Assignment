# 직결 (urdfv2) — controllers_4wd.yaml 다음에 diff_drive_controller 에 덮어 씀
#   바퀴 한계: 7.91 rad/s × 0.033 ≈ 0.261 m/s (펌웨어 D6 — 호스트 한계를 바퀴 한계에 맞춤)
diff_drive_controller:
  ros__parameters:
    wheel_separation: 0.2744         # 바퀴 중심 |y| 0.1372 × 2 (URDF drive:=direct 와 같게)
    linear.x.max_velocity: 0.26
    linear.x.min_velocity: -0.26
