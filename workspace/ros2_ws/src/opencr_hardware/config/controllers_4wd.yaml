# 컨트롤러 (Firmware 팀) — 4바퀴 (waffle_4wd)
controller_manager:
  ros__parameters:
    update_rate: 100

diff_drive_controller:
  ros__parameters:
    type: diff_drive_controller/DiffDriveController
    left_wheel_names: ["wheel_left_front_joint", "wheel_left_rear_joint"]
    right_wheel_names: ["wheel_right_front_joint", "wheel_right_rear_joint"]
    # wheel_separation · linear.x 한계는 구동 방식별 drive_<direct|belt>.yaml (base_bringup 의 drive 인자가 고름)
    wheel_separation_multiplier: 1.0
    wheel_radius: 0.0335   # 2026-11-13 홈 채운 림 R31.5 + 타이어 (Ø67, 이전 0.033)
    odom_frame_id: odom
    base_frame_id: base_link
    enable_odom_tf: false            # odom→base_link TF 는 ekf 만 발행
    cmd_vel_timeout: 0.5
    linear.x.max_acceleration: 1.5
    linear.x.max_deceleration: -1.5   # diff_drive 6.x 이름 (예전 min_acceleration 은 인자가 없어 무시됨). 음수
    # 회전 상한 = 모든 입력 (조이스틱 · Nav2 · drive_node · 정책) 의 마지막 벽. 2.0 → 1.0 (2026-11-12): 벨트 구동에서 모터 = 로봇 회전 × 3.20,
    #   11-11 바닥 제자리 회전 모터 3.0 에서 뒤 바퀴 출렁 · 7.0 에서 벨트 빠짐 → 2.0 (모터 6.4) 은 위험 영역. 1.0 = 모터 3.2 = Nav2 wz_max 기본값
    angular.z.max_velocity: 1.0
    angular.z.min_velocity: -1.0

arm_controller:
  ros__parameters:
    type: joint_trajectory_controller/JointTrajectoryController
    joints: [joint1, joint2, joint3, joint4, joint5, gripper_roll]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: false
    # 2026-11-12 실물 cart11 (#165 · #190): 관절 2 · 3 이 중력으로 1 ~ 3° 처진 실측 위치에서 새 궤적 보간을 시작하면 명령이 튀어
    #   다른 관절이 움직일 때마다 평균 1.3° · 최대 5° 덜컹 -> 직전 원하는 상태에서 시작 (측정 도구에서 평균 0.05°, 30 배 감소).
    #   ★ 파라미터 이름 젯슨에서 확인: ros2 param list /arm_controller | grep -iE 'interpolate|open_loop' (Jazzy 이후 interpolate_from_desired_state,
    #   그 전 open_loop_control). E-stop · HOLD · REARM 뒤 원하는 상태가 오래된 값이면 튈 수 있음 -> 시작 정리 (startup STOW) 동작 확인
    interpolate_from_desired_state: true
    constraints:
      goal_time: 1.0
      stopped_velocity_tolerance: 0.05

joint_state_broadcaster:
  ros__parameters:
    type: joint_state_broadcaster/JointStateBroadcaster

imu_sensor_broadcaster:
  ros__parameters:
    type: imu_sensor_broadcaster/IMUSensorBroadcaster
    sensor_name: imu
    frame_id: imu_link

# 그리퍼 개폐 액추에이터가 정해지면 use_gripper:=true 와 함께 사용 ★
gripper_controller:
  ros__parameters:
    type: parallel_gripper_action_controller/GripperActionController
    joint: gripper_joint
